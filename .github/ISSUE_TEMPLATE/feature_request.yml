name: Feature request
description: A seed, filter, tool or host you wish Lineupify supported
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The sentence you would type to your assistant, and what you would want to get back.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today?
  - type: textarea
    id: idea
    attributes:
      label: Proposed shape (optional)
      description: A new seed type, a new option on create_draft, a new tool, a CLI command...
