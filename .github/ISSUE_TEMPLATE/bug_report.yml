name: Bug report
description: Something does not work (setup, login, a build, a playlist)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Most problems are Spotify setup problems. Please run `npx -y lineupify-mcp doctor` and paste the output below; it contains no secrets (the Client ID is public by design, tokens are never printed).
  - type: textarea
    id: doctor
    attributes:
      label: Output of `lineupify-mcp doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: MCP host
      options: [Claude Desktop, Claude Code, Cursor, Other (say which below)]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node.js version
      placeholder: Windows 11, Node 22.11
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you ask for, and what happened?
      description: "The tool call or the sentence you typed, the error code if any (they look like `SPOTIFY_FORBIDDEN: ...`), and what you expected."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (optional)
      description: Lineupify logs to stderr, which your host writes to its MCP log file. Tokens are redacted automatically; please still check before pasting.
      render: text
