version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # eslint and @eslint/js share a major and peer-depend on each other; always bump them together.
      eslint:
        patterns: ["eslint", "@eslint/*"]
      # Minor and patch updates of the remaining dev tooling arrive together; other majors come one PR each.
      dev-dependencies-minor:
        dependency-type: development
        exclude-patterns: ["eslint", "@eslint/*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint pins a TypeScript range and lags each major; a TypeScript
      # major PR fails at `npm ci` until it catches up. Minors and patches still flow.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node types track the lowest Node version we support (engines >= 20), not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
