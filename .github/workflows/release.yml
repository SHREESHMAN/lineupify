# Publishes to npm and attaches the Claude Desktop bundle to a GitHub release.
# Trigger: push a tag that matches package.json, e.g.
#   npm version minor            # bumps package.json (+ manifest/server.json via the version script) and tags
#   git push --follow-tags
# or run it by hand from the Actions tab (workflow_dispatch) for the current version.
#
# npm publishing uses npm Trusted Publishing (OIDC): the package's settings on
# npmjs.com name this repository and this workflow file as a trusted publisher,
# so no token is stored anywhere. id-token: write below is what makes that work.
# If the version is already on npm (for example published from a laptop), the
# publish step is skipped and the GitHub release is still created.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; the runner's Node 22 ships an older npm.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Resolve version and tag
        id: meta
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1
          fi
          if npm view "lineupify-mcp@$v" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"; echo "lineupify-mcp@$v is already on npm; publish will be skipped"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (trusted publishing, with provenance)
        if: steps.meta.outputs.published == 'false'
        run: npm publish --provenance --access public

      - name: Build Claude Desktop bundle
        run: npm run bundle:mcpb

      - name: GitHub release with the .mcpb attached
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then git tag "$tag" && git push origin "$tag"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/lineupify-*.mcpb --clobber
          else
            gh release create "$tag" build/lineupify-*.mcpb --title "$tag" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
